name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json is not fully in sync with package.json, so use install (not ci)
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build app and installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List output
        shell: bash
        run: ls -la release || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logicbench-windows
          path: |
            release/LogicBench-Setup-*.exe
          if-no-files-found: error

      - name: Publish release (only for tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/LogicBench-Setup-*.exe
